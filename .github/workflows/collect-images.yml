name: Collect and assess civic images

"on":
  workflow_dispatch:
    inputs:
      screen_requests:
        description: Maximum new image assessments (cached images cost no requests)
        type: choice
        options: ["100", "200", "300", "500"]
        default: "300"
      apify_pilots:
        description: Opt in to capped Instagram, Facebook and Threads free-credit pilots
        type: boolean
        default: false
  # Daily collection is deliberately OFF. To enable later, add:
  # schedule:
  #   - cron: '23 11 * * *'  # 11:23 UTC; Toronto local time changes with DST.

permissions:
  contents: read

concurrency:
  group: civic-image-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scraping/requirements.txt
      - run: python -m pip install -r scraping/requirements.txt
      - name: Verify collection logic offline
        run: python -m unittest discover -s scraping/tests -t . -p 'test_*.py' -q
      - name: Restore assessment state (text only)
        uses: actions/cache/restore@v6
        with:
          path: |
            scraping/data/workflow/screening-cache.jsonl
            scraping/data/workflow/combined/screening.jsonl
            scraping/data/workflow/previous-run.json
            scraping/data/issue-details-cache.jsonl
            scraping/data/workflow/pilots/*/apify-run.json
          key: civic-assessments-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: civic-assessments-v1-
      - name: Collect, screen, group and describe
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          SCREEN_REQUESTS: ${{ inputs.screen_requests || '300' }}
          APIFY_PILOTS: ${{ inputs.apify_pilots || false }}
        shell: bash
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo 'Configure the GEMINI_API_KEY repository secret before running collection.' >&2
            exit 1
          fi
          pilot_args=()
          if [ "$APIFY_PILOTS" = true ]; then
            pilot_args+=(--apify-pilots)
          fi
          python -m scraping.workflow \
            --max-screen-requests "$SCREEN_REQUESTS" \
            --max-description-requests 100 \
            --exploration-images 50 \
            "${pilot_args[@]}"
      - name: Save assessment state, including partial progress
        if: ${{ always() && !cancelled() }}
        uses: actions/cache/save@v6
        with:
          path: |
            scraping/data/workflow/screening-cache.jsonl
            scraping/data/workflow/combined/screening.jsonl
            scraping/data/workflow/previous-run.json
            scraping/data/issue-details-cache.jsonl
            scraping/data/workflow/pilots/*/apify-run.json
          key: civic-assessments-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Summarize results
        if: ${{ always() }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('scraping/data/workflow/workflow-report.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              if not path.exists():
                  summary.write('Collection did not reach the reporting stage. See the failed step.\n')
              else:
                  report = json.loads(path.read_text())
                  summary.write(f"Status: **{report['status']}**\n\n")
                  for field in ('distinct_ready_images', 'passed_images', 'supported_images', 'supported_post_groups', 'context_images'):
                      summary.write(f"- {field.replace('_', ' ').capitalize()}: {report.get(field, 'pending')}\n")
                  summary.write('\nDownload the text handoff artifact to restore images locally. No unblurred image files are uploaded.\n')
          PY
      - name: Upload text handoff and reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: civic-image-handoff-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            scraping/data/workflow/workflow-report.json
            scraping/data/workflow/export/*.json
            scraping/data/workflow/export/*.jsonl
