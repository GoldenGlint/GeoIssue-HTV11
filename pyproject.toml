[project]
name = "civiclens-spikes"
version = "0.1.0"
description = "CivicLens feasibility spikes: scraping yield and Toronto image geolocation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.27",
  "websockets>=13",
  "pydantic>=2.8",
  "python-dotenv>=1.0",
  "tqdm>=4.66",
  "numpy>=2.0",
  "pandas>=2.2",
  "pillow>=10.4",
  "imagehash>=4.3",
  "rapidfuzz>=3.9",
  "shapely>=2.0",
  "pyproj>=3.6",
  "h3>=4.1",
  "duckdb>=1.1",
  "mercantile>=1.2",
  "mapbox-vector-tile>=2.1",
  "google-genai>=1.0",
  "Mastodon.py>=2.0",
  "feedparser>=6.0",
  "pyarrow>=17",
]

[project.optional-dependencies]
ml = [
  "torch>=2.6",
  "torchvision>=0.21",
  "transformers>=4.50",
  "sentencepiece>=0.2",
  "protobuf>=5",
  "faiss-cpu>=1.8",
  "lightgbm>=4.5",
  "scikit-learn>=1.5",
  "kornia>=0.7",
  "lightglue @ git+https://github.com/cvg/LightGlue",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
