<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f6f8" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="GeoIssue — a shared workspace for discovering, understanding, and verifying Toronto's civic issues." />
    <title>GeoIssue · Toronto civic intelligence</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%232563eb' stroke-width='4'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%232563eb'/%3E%3C/svg%3E" />
    <script>
      try {
        // Light is the default; a saved "dark" (or "system" on a dark device) switches before first paint.
        const theme = JSON.parse(localStorage.getItem('geoissue:theme'));
        if (theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.dataset.theme = 'dark';
          document.querySelector('meta[name="theme-color"]').content = '#0e0f11';
          document.querySelector('meta[name="color-scheme"]').content = 'dark';
        }
      } catch {}
    </script>
    <link rel="stylesheet" href="./src/styles.css?v=12" />
    <style>
      /* Loading screen, inline so it is styled from the first frame. The lens draws itself, issues blink in
         around it like pins being found, the name rises in, and app.js fades it out once the map is ready. */
      #splash{position:fixed;inset:0;z-index:1000;display:grid;place-content:center;justify-items:center;gap:12px;background:#f5f6f8;font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;transition:opacity .35s ease,visibility .35s}
      #splash.done{opacity:0;visibility:hidden;pointer-events:none}
      .splash-mark{width:168px;height:168px;overflow:visible}
      .splash-ring{fill:none;stroke:#2563eb;stroke-width:5;stroke-linecap:round;stroke-dasharray:214;stroke-dashoffset:214;transform:rotate(-90deg);transform-origin:60px 60px;animation:splash-draw .65s cubic-bezier(.6,0,.2,1) forwards}
      .splash-ring.outer{stroke:#bfd2fd;stroke-width:1.5;stroke-dasharray:302;stroke-dashoffset:302;animation-delay:.12s}
      .splash-core{fill:#2563eb;transform-origin:60px 60px;transform:scale(0);animation:splash-pop .45s cubic-bezier(.3,1.6,.5,1) .38s forwards}
      .splash-pins circle{fill:var(--c);transform-box:fill-box;transform-origin:center;transform:scale(0);opacity:0;animation:splash-pop .35s cubic-bezier(.3,1.6,.5,1) var(--d) forwards}
      .splash-word{font:700 36px/1 Inter,system-ui,sans-serif;letter-spacing:-1px;color:#111827;opacity:0;transform:translateY(10px);animation:splash-rise .45s ease-out .55s forwards}
      .splash-word span{color:#2563eb}
      .splash-sub{font-size:14px;color:#545b67;opacity:0;animation:splash-rise .45s ease-out .7s forwards}
      :root[data-theme="dark"] #splash{background:#0e0f11}
      :root[data-theme="dark"] .splash-word{color:#ececef}
      :root[data-theme="dark"] .splash-word span{color:#82aaff}
      :root[data-theme="dark"] .splash-sub{color:#a0a4ad}
      :root[data-theme="dark"] .splash-ring.outer{stroke:#2c4a85}
      :root[data-theme="dark"] .splash-ring,:root[data-theme="dark"] .splash-core{stroke:#3b74ee}
      :root[data-theme="dark"] .splash-core{fill:#3b74ee}
      @keyframes splash-draw{to{stroke-dashoffset:0}}
      @keyframes splash-pop{to{transform:scale(1);opacity:1}}
      @keyframes splash-rise{to{opacity:1;transform:none}}
      @media(prefers-reduced-motion:reduce){#splash *{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}.splash-ring{transform:rotate(-90deg)!important}}
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <svg class="splash-mark" viewBox="0 0 120 120">
        <circle class="splash-ring outer" cx="60" cy="60" r="48" />
        <circle class="splash-ring" cx="60" cy="60" r="34" />
        <circle class="splash-core" cx="60" cy="60" r="13" />
        <g class="splash-pins">
          <circle cx="10" cy="31" r="4" style="--c:#dc2626;--d:.45s" />
          <circle cx="104" cy="23" r="4" style="--c:#d97706;--d:.52s" />
          <circle cx="114" cy="80" r="4" style="--c:#7c3aed;--d:.58s" />
          <circle cx="50" cy="117" r="4" style="--c:#059669;--d:.64s" />
          <circle cx="5" cy="80" r="4" style="--c:#2563eb;--d:.7s" />
          <circle cx="55" cy="2" r="4" style="--c:#6b7280;--d:.76s" />
        </g>
      </svg>
      <div class="splash-word">Geo<span>Issue</span></div>
      <div class="splash-sub">Toronto civic issues</div>
    </div>
    <div id="app"></div>
    <div id="modal-root"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
